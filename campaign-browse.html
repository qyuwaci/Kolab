<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari job – Kolab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .job { display: flex; flex-direction: column; gap: 14px; }
    .job .net { font-family: var(--font-serif); font-size: 40px; line-height: 1; letter-spacing: -0.02em; }
    .job .brief { font-size: 14px; color: var(--copy); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <main class="container">
    <div class="page-head">
      <div>
        <span class="eyebrow">Job untuk kreator</span>
        <h1 style="margin: 8px 0 0;">Cari job dari UMKM lokal</h1>
        <p>Honor yang tertulis besar adalah yang masuk ke dompetmu, sudah dipotong biaya layanan sesuai paketmu.</p>
      </div>
      <form class="filter-bar" role="search" onsubmit="return false;" style="min-width: min(100%, 460px);">
        <label class="sr-only" for="nicheSelect">Bidang</label>
        <select id="nicheSelect" class="input" style="flex: 1 1 160px;">
          <option value="">Semua bidang</option>
          <option value="food">Kuliner dan minuman</option>
          <option value="fashion">Fashion</option>
          <option value="beauty">Kecantikan</option>
          <option value="lifestyle">Gaya hidup</option>
          <option value="lainnya">Lainnya</option>
        </select>
        <label class="sr-only" for="searchInput">Cari judul atau nama usaha</label>
        <input type="search" id="searchInput" class="input" placeholder="Cari judul atau nama usaha" style="flex: 2 1 220px;">
      </form>
    </div>
    <div id="feeNote" class="notice-bar" style="margin-bottom: 20px;"></div>
    <div id="jobs" class="job-grid" aria-live="polite"></div>
  </main>

  <script type="module" src="/src/kolab-cloud.ts"></script>
  <script type="module" src="/src/kolab-ui.ts"></script>
  <script type="module">
    const KolabDB = window.KolabDB;
    const KolabUI = window.KolabUI;
    await KolabDB.ready();
    const session = KolabDB.requireRole(['creator']);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const rp = (n) => KolabDB.formatRupiah(n || 0);
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) : '-';
    const NICHE = { food: 'Kuliner', fashion: 'Fashion', beauty: 'Kecantikan', lifestyle: 'Gaya hidup', lainnya: 'Lainnya' };
    const STATUS = { pending: ['Menunggu keputusan UMKM', 'badge-notice'], invited: ['Kamu diundang', 'badge-accent'], accepted: ['Diterima', 'badge-open'], completed: ['Selesai', 'badge-completed'], rejected: ['Tidak dipilih', 'badge-neutral'], declined: ['Kamu menolak', 'badge-neutral'], expired: ['Batal (lewat batas)', 'badge-neutral'] };

    if (session) {
      KolabUI.renderNavbar('campaign-browse');
      const plan = KolabDB.getUserPlan(session.id)?.plan || {};
      const fee = typeof plan.platformFeeRate === 'number' ? plan.platformFeeRate : 0.15;
      document.getElementById('feeNote').innerHTML = `Biaya layanan paket ${esc(plan.name || 'Gratis')}: <strong style="margin: 0 4px;">${Math.round(fee * 100)}%</strong>. <a href="pricing.html" style="text-decoration: underline; font-weight: 600;">Paket Plus atau Pro</a>&nbsp;memotong lebih sedikit.`;

      function render() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const niche = document.getElementById('nicheSelect').value;
        const mine = KolabDB.getApplicationsByCreator(session.id);
        let list = KolabDB.getOpenCampaigns().filter((c) => !c.deadline || new Date(c.deadline + 'T23:59:59') >= new Date());
        if (niche) list = list.filter((c) => (c.targetNiche || c.niche) === niche);
        if (q) list = list.filter((c) => {
          const u = KolabDB.getUserById(c.umkmId);
          return [c.title, c.brief, u?.name, u?.businessName].some((x) => String(x || '').toLowerCase().includes(q));
        });
        const box = document.getElementById('jobs');
        if (!list.length) {
          box.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><strong>Belum ada job yang cocok</strong>Job baru dari UMKM akan muncul di sini. Sambil menunggu, lengkapi profil dan sambungkan akun sosmedmu supaya mudah dipilih.<div style="margin-top: 14px;"><a href="creator-analytics.html" class="btn-outline btn-sm">Sambungkan akun sosmed</a></div></div>`;
          return;
        }
        box.innerHTML = list.map((c) => {
          const u = KolabDB.getUserById(c.umkmId) || {};
          const app = mine.find((a) => a.campaignId === c.id);
          const net = Math.round(c.budgetPerSlot * (1 - fee));
          const rights = KolabDB.usageRightsOf(c);
          const platforms = Array.isArray(c.platform) ? c.platform : [c.platform];
          const st = app ? STATUS[app.status] : null;
          return `
            <article class="card card-lift job">
              <div style="display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;">
                <div style="min-width: 0;">
                  <div style="font-size: 13px; color: var(--meta);">${esc(u.businessName || u.name || 'UMKM')}${u.city ? ' · ' + esc(u.city) : ''}</div>
                  <h2 class="card-title" style="margin: 4px 0 0;">${esc(c.title)}</h2>
                </div>
                ${st ? `<span class="badge ${st[1]}">${st[0]}</span>` : ''}
              </div>
              <div>
                <div style="font-size: 13px; color: var(--meta);">Honor masuk ke dompetmu</div>
                <div class="net tabular-nums">${rp(net)}</div>
                <div style="font-size: 13px; color: var(--meta); margin-top: 4px;">Honor ${rp(c.budgetPerSlot)} dikurangi biaya layanan ${Math.round(fee * 100)}%</div>
              </div>
              <div class="chips">
                <span class="chip">${esc(NICHE[c.targetNiche || c.niche] || 'Umum')}</span>
                ${platforms.map((p) => `<span class="chip">${esc(p)}</span>`).join('')}
                <span class="chip">${esc(c.contentType || 'Video review')}</span>
              </div>
              <p class="brief" style="margin: 0;">${esc(c.brief)}</p>
              <div class="kv"><span class="k">Sisa slot</span><span class="v">${c.slotsLeft} dari ${c.slots}</span></div>
              <div class="kv"><span class="k">Batas kirim video</span><span class="v">${fmtDate(c.deadline)}</span></div>
              <div class="kv"><span class="k">Hak pakai untuk UMKM</span><span class="v">${esc(rights.label)}</span></div>
              ${app ? `<a href="dashboard-creator.html" class="btn-outline" style="margin-top: auto;">Lihat di dashboard</a>`
                : `<button type="button" class="btn-primary" data-apply="${c.id}" style="margin-top: auto;" ${c.slotsLeft === 0 ? 'disabled' : ''}>${c.slotsLeft === 0 ? 'Slot penuh' : 'Lamar job ini'}</button>`}
            </article>`;
        }).join('');
        box.querySelectorAll('[data-apply]').forEach((b) => b.addEventListener('click', async () => {
          b.disabled = true;
          const r = KolabDB.applyToCampaign(b.dataset.apply, session.id);
          await KolabDB.flush();
          KolabUI.showToast(r.ok ? 'Lamaran terkirim. UMKM akan memilih, kamu dapat kabar di dashboard.' : r.message);
          render();
        }));
      }
      document.getElementById('searchInput').addEventListener('input', render);
      document.getElementById('nicheSelect').addEventListener('change', render);
      render();
    }
  </script>
</body>
</html>
