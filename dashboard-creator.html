<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard kreator – Kolab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    .job { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); }
    .job + .job { margin-top: 14px; }
    .job-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    .job-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--meta); margin-top: 4px; }
    .balance-big { font-family: var(--font-serif); font-size: 52px; line-height: 1; letter-spacing: -0.02em; }
    .submit-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .submit-row .input { flex: 1 1 260px; }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <main class="container">
    <div class="page-head">
      <div>
        <span class="eyebrow">Dashboard kreator</span>
        <h1 id="welcomeTitle" style="margin: 8px 0 0;">Halo!</h1>
        <p>Lamar job dari UMKM, kirim video, dan honor masuk ke dompetmu setelah disetujui.</p>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <a href="campaign-browse.html" class="btn-primary">Cari job</a>
        <a href="wallet-creator.html" class="btn-outline">Tarik dana</a>
      </div>
    </div>

    <section id="invites" style="display: none; margin-bottom: 20px;" aria-labelledby="invTitle"></section>

    <div class="grid-main-side">
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <section class="card" id="onboardingCard" style="display: none;" aria-labelledby="onbTitle">
          <div class="card-header">
            <h2 class="card-title" id="onbTitle">Supaya cepat dapat job</h2>
            <span class="badge badge-soft" id="onbProgress"></span>
          </div>
          <ul class="checklist" id="onbList"></ul>
        </section>

        <section class="card" aria-labelledby="jobsTitle">
          <div class="card-header">
            <h2 class="card-title" id="jobsTitle">Job yang sedang jalan</h2>
            <a href="campaign-browse.html" class="btn-outline btn-sm">Cari job lain</a>
          </div>
          <div id="activeJobs"></div>
        </section>

        <section class="card" aria-labelledby="appsTitle">
          <div class="card-header">
            <h2 class="card-title" id="appsTitle">Lamaranmu</h2>
          </div>
          <div id="applications"></div>
        </section>
      </div>

      <aside style="display: flex; flex-direction: column; gap: 20px;">
        <section class="card card-dark" aria-labelledby="walletTitle">
          <h2 class="card-title" id="walletTitle" style="margin: 0 0 16px;">Dompet</h2>
          <div style="font-size: 14px; color: var(--night-text);">Bisa ditarik</div>
          <div class="balance-big tabular-nums" id="walletBalance">Rp0</div>
          <div style="font-size: 13px; color: var(--night-text); margin-top: 8px;" id="payoutHint"></div>
          <a href="wallet-creator.html" class="btn-primary" style="width: 100%; margin-top: 18px;">Tarik ke bank atau e-wallet</a>
        </section>
        <section class="card" id="planCard" aria-label="Paket kamu"></section>
        <section class="card" id="profileCard" aria-label="Profil kamu"></section>
      </aside>
    </div>
  </main>

  <script type="module" src="/src/kolab-cloud.ts"></script>
  <script type="module" src="/src/kolab-ui.ts"></script>
  <script type="module">
    const KolabDB = window.KolabDB;
    const KolabUI = window.KolabUI;
    await KolabDB.ready();
    const session = KolabDB.requireRole(['creator']);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const rp = (n) => KolabDB.formatRupiah(n || 0);
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';

    if (session) {
      KolabUI.renderNavbar('dashboard-creator');
      const firstName = String(session.name || '').split(' ')[0];
      document.getElementById('welcomeTitle').textContent = firstName ? `Halo, ${firstName}` : 'Halo!';
      const plan = KolabDB.getUserPlan(session.id)?.plan || {};
      const fee = typeof plan.platformFeeRate === 'number' ? plan.platformFeeRate : 0.15;
      const net = (c) => Math.round((c?.budgetPerSlot || 0) * (1 - fee));

      function render() {
        const wallet = KolabDB.getWallet(session.id);
        document.getElementById('walletBalance').textContent = rp(wallet.balance);
        document.getElementById('payoutHint').textContent = `Minimal penarikan ${rp(KolabDB.MIN_PAYOUT || 50000)}. Honor sudah dipotong biaya layanan saat video disetujui.`;

        const apps = KolabDB.getApplicationsByCreator(session.id).map((a) => ({ a, c: KolabDB.getCampaignById(a.campaignId) })).filter((x) => x.c);
        const invites = apps.filter((x) => x.a.status === 'invited' && x.c.status === 'open');
        const active = apps.filter((x) => x.a.status === 'accepted' || x.a.status === 'completed');
        const others = apps.filter((x) => ['pending', 'rejected', 'declined', 'expired'].includes(x.a.status));

        // Undangan
        const inv = document.getElementById('invites');
        if (invites.length) {
          inv.style.display = 'block';
          inv.innerHTML = `
            <div class="card card-accent">
              <h2 class="card-title" id="invTitle" style="margin: 0 0 14px;">Kamu diundang ${invites.length === 1 ? 'ke 1 kampanye' : `ke ${invites.length} kampanye`}</h2>
              ${invites.map(({ a, c }) => {
                const u = KolabDB.getUserById(c.umkmId) || {};
                return `
                <div class="job">
                  <div class="job-top">
                    <div style="min-width: 0;">
                      <div style="font-weight: 600; font-size: 16px;">${esc(c.title)}</div>
                      <div class="job-meta"><span>${esc(u.businessName || u.name || 'UMKM')}</span><span>Honor masuk ${rp(net(c))}</span><span>Batas ${fmtDate(c.deadline)}</span><span>${esc(KolabDB.usageRightsOf(c).label)}</span></div>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                      <button type="button" class="btn-outline btn-sm" data-decline="${a.id}">Tolak</button>
                      <button type="button" class="btn-primary btn-sm" data-join="${a.id}">Terima undangan</button>
                    </div>
                  </div>
                  <p style="margin: 0; font-size: 14px; color: var(--copy); white-space: pre-line;">${esc(c.brief)}</p>
                </div>`;
              }).join('')}
            </div>`;
          inv.querySelectorAll('[data-join]').forEach((b) => b.addEventListener('click', async () => {
            const r = KolabDB.respondInvitation(b.dataset.join, true);
            await KolabDB.flush();
            KolabUI.showToast(r.ok ? 'Undangan diterima. Selamat membuat video!' : r.message);
            render();
          }));
          inv.querySelectorAll('[data-decline]').forEach((b) => b.addEventListener('click', async () => {
            const r = KolabDB.respondInvitation(b.dataset.decline, false);
            await KolabDB.flush();
            KolabUI.showToast(r.ok ? 'Undangan ditolak.' : r.message);
            render();
          }));
        } else {
          inv.style.display = 'none';
        }

        // Job berjalan
        const jobsBox = document.getElementById('activeJobs');
        jobsBox.innerHTML = active.length ? active.map(({ a, c }) => {
          const sub = KolabDB.getSubmissionByApplication(a.id);
          const u = KolabDB.getUserById(c.umkmId) || {};
          const count = Number(sub?.revisionCount || 0);
          let status = ['Buat dan kirim videomu', 'badge-accent'];
          if (sub?.status === 'submitted') status = ['Menunggu review UMKM', 'badge-notice'];
          if (sub?.status === 'revision') status = ['Perlu revisi', 'badge-accent'];
          if (sub?.status === 'approved') status = ['Disetujui, honor masuk', 'badge-open'];
          const hrs = sub ? KolabDB.autoApproveHoursLeft(sub) : null;
          const canSend = !sub || sub.status === 'revision';
          return `
            <div class="job">
              <div class="job-top">
                <div style="min-width: 0;">
                  <div style="font-weight: 600; font-size: 16px;">${esc(c.title)}</div>
                  <div class="job-meta"><span>${esc(u.businessName || u.name || 'UMKM')}</span><span>Honor masuk ${rp(net(c))}</span><span>Batas ${fmtDate(c.deadline)}</span>${sub ? `<span>Revisi ${count} dari ${KolabDB.MAX_REVISIONS}</span>` : ''}</div>
                </div>
                <span class="badge ${status[1]}">${status[0]}</span>
              </div>
              <details ${!sub ? 'open' : ''}>
                <summary style="cursor: pointer; font-weight: 600; font-size: 14px; min-height: 28px;">Arahan video</summary>
                <p style="margin: 8px 0 0; font-size: 14px; color: var(--copy); white-space: pre-line;">${esc(c.brief)}</p>
              </details>
              ${sub?.status === 'revision' ? `<div class="chat-thread"><div class="chat-bubble in">${esc(sub.revisionNote || 'UMKM meminta revisi.')}<span class="time">Catatan revisi ke-${count} dari UMKM</span></div></div>` : ''}
              ${sub?.status === 'submitted' ? `<div style="font-size: 14px; color: var(--copy);">Kalau UMKM tidak merespons, videomu otomatis disetujui dalam <strong>${Math.ceil(hrs ?? 0)} jam</strong>.</div>` : ''}
              ${canSend ? `
                <form class="submit-row" data-submit="${a.id}" novalidate>
                  <label class="sr-only" for="url_${a.id}">Link video</label>
                  <input type="url" id="url_${a.id}" class="input" placeholder="Tempel link video TikTok, Instagram, atau YouTube" value="${sub ? esc(sub.fileUrl) : ''}">
                  <label class="sr-only" for="note_${a.id}">Catatan untuk UMKM</label>
                  <input type="text" id="note_${a.id}" class="input" maxlength="300" placeholder="Catatan singkat untuk UMKM (opsional)">
                  <button type="submit" class="btn-primary">${sub ? 'Kirim revisi' : 'Kirim video'}</button>
                </form>` : ''}
              ${sub?.status === 'approved' ? `<a href="creator-library.html" class="text-accent" style="font-weight: 600; font-size: 14px;">Atur video ini di Video saya</a>` : ''}
            </div>`;
        }).join('') : `<div class="empty-state"><strong>Belum ada job berjalan</strong>Lamar job yang cocok. Setelah UMKM memilihmu, job akan muncul di sini.<div style="margin-top: 14px;"><a href="campaign-browse.html" class="btn-primary btn-sm">Cari job</a></div></div>`;

        jobsBox.querySelectorAll('[data-submit]').forEach((f) => f.addEventListener('submit', async (e) => {
          e.preventDefault();
          const id = f.dataset.submit;
          const url = document.getElementById('url_' + id).value.trim();
          if (!/^https?:\/\//i.test(url)) { KolabUI.showToast('Tempel link video yang lengkap, diawali https://'); return; }
          const r = KolabDB.submitContent(id, session.id, { fileUrl: url, note: document.getElementById('note_' + id).value.trim() });
          await KolabDB.flush();
          KolabUI.showToast(r.ok ? 'Video terkirim. UMKM punya waktu 3×24 jam untuk review.' : r.message);
          render();
        }));

        // Lamaran lain
        const LABEL = { pending: ['Menunggu keputusan UMKM', 'badge-notice'], rejected: ['Tidak dipilih', 'badge-neutral'], declined: ['Kamu menolak undangan', 'badge-neutral'], expired: ['Batal, lewat batas waktu', 'badge-neutral'] };
        document.getElementById('applications').innerHTML = others.length ? others.map(({ a, c }) => `
          <div class="kv"><span class="k" style="color: var(--ink); font-weight: 500;">${esc(c.title)}</span><span class="badge ${LABEL[a.status][1]}">${LABEL[a.status][0]}</span></div>`).join('')
          : `<div style="font-size: 14px; color: var(--meta);">Lamaran yang masih menunggu keputusan akan muncul di sini.</div>`;

        // Paket
        document.getElementById('planCard').innerHTML = `
          <h2 class="card-title" style="margin: 0 0 12px; font-size: 22px;">Paket ${esc(plan.name || 'Gratis')}</h2>
          <div class="kv"><span class="k">Biaya layanan</span><span class="v">${Math.round(fee * 100)}%</span></div>
          <div class="kv"><span class="k">Jual video di Video siap pakai</span><span class="v">${plan.maxLibraryListings >= 999 ? 'Tanpa batas' : (plan.maxLibraryListings ?? 2) + ' video'}</span></div>
          <a href="pricing.html" class="btn-outline btn-sm" style="width: 100%; margin-top: 14px;">${fee > 0.07 ? 'Hemat biaya layanan' : 'Kelola paket'}</a>`;

        // Profil
        const me = KolabDB.getUserById(session.id) || {};
        const soc = KolabDB.getSocialSummary(session.id) || {};
        const rev = KolabDB.getReviewsForUser(session.id) || {};
        document.getElementById('profileCard').innerHTML = `
          <h2 class="card-title" style="margin: 0 0 12px; font-size: 22px;">Profilmu</h2>
          <div class="kv"><span class="k">Bidang</span><span class="v">${esc(me.niche ? me.niche.charAt(0).toUpperCase() + me.niche.slice(1) : 'Belum diisi')}</span></div>
          <div class="kv"><span class="k">Akun sosmed tersambung</span><span class="v">${soc.connectedCount || 0} dari 3</span></div>
          <div class="kv"><span class="k">Rating dari UMKM</span><span class="v">${rev.average != null ? rev.average + ' (' + rev.count + ' ulasan)' : 'Belum ada'}</span></div>
          <div class="kv"><span class="k">Status</span><span class="v">${soc.connectedCount > 0 ? 'Akun terverifikasi' : 'Belum terverifikasi'}</span></div>
          <a href="creator-profile.html?id=${encodeURIComponent(session.id)}" class="btn-outline btn-sm" style="width: 100%; margin-top: 14px;">Lihat profil publik</a>`;

        // Langkah pertama
        const steps = [
          { label: 'Sambungkan akun TikTok, Instagram, atau YouTube', done: (soc.connectedCount || 0) > 0, href: 'creator-analytics.html' },
          { label: 'Lamar job pertama', done: apps.length > 0, href: 'campaign-browse.html' },
          { label: 'Kirim video pertama', done: active.some(({ a }) => KolabDB.getSubmissionByApplication(a.id)), href: '#activeJobs' },
        ];
        const doneCount = steps.filter((s) => s.done).length;
        const onb = document.getElementById('onboardingCard');
        onb.style.display = doneCount < steps.length ? 'block' : 'none';
        document.getElementById('onbProgress').textContent = `${doneCount} dari ${steps.length}`;
        document.getElementById('onbList').innerHTML = steps.map((s, i) => `
          <li class="${s.done ? 'done' : ''}"><span class="tick" aria-hidden="true">${s.done ? '✓' : i + 1}</span><span style="flex: 1;"><span class="label">${s.label}</span>${s.done ? '' : ` <a href="${s.href}" class="text-accent" style="font-weight: 600; margin-left: 6px;">Mulai</a>`}</span></li>`).join('');
      }
      render();
    }
  </script>
</body>
</html>
