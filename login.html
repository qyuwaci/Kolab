<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk dengan Google - Kolab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .auth-card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 36px 28px;
      text-align: center;
    }
    .google-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .google-btn:hover:not(:disabled) {
      border-color: var(--ink);
      background: var(--paper);
    }
    .google-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    @media (max-width: 767px) {
      .auth-wrapper {
        padding: 20px 16px;
      }
      .auth-card {
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div style="margin-bottom: 24px; text-align: center;">
      <a href="index.html" class="nav-brand" style="font-size: 28px; justify-content: center;">
        Kolab<span class="brand-dot" aria-hidden="true"></span>
      </a>
      <p style="margin: 6px 0 0; font-size: 14px; color: var(--copy);">Video promosi dari kreator lokal</p>
    </div>

    <div class="auth-card">
      <h2 style="margin: 0 0 8px; font-size: 22px; font-weight: 700;">Masuk ke Kolab</h2>
      <p style="margin: 0 0 24px; font-size: 14px; color: var(--copy); line-height: 1.5;">
        Masuk dengan akun Google yang kamu pakai saat mendaftar.
      </p>

      <div id="loadingBox" style="font-size: 13px; color: var(--copy); margin-bottom: 16px;">
        Memeriksa sesi masuk...
      </div>

      <button type="button" id="btnGoogleLogin" class="google-btn" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Lanjutkan dengan Google</span>
      </button>

      <div id="generalError" class="error-text" style="margin-top: 14px; display: none;"></div>

      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--copy);">
        Pengguna baru? <a href="register.html" style="color: var(--accent); font-weight: 600;">Daftar di sini</a>
        <div id="adminLoginWrap" style="margin-top: 10px; display: none;">
          <button type="button" id="btnAdminLogin" style="background: none; border: none; color: var(--copy); font-size: 12px; text-decoration: underline; cursor: pointer; font-family: inherit;">
            Masuk sebagai Administrator
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/kolab-cloud.ts"></script>
  <script type="module">
    const KolabDB = window.KolabDB;
    await KolabDB.ready();

    const loadingBox = document.getElementById('loadingBox');
    const btnGoogleLogin = document.getElementById('btnGoogleLogin');
    const btnAdminLogin = document.getElementById('btnAdminLogin');
    const generalError = document.getElementById('generalError');

    function redirectByRole(role) {
      if (role === 'umkm') window.location.href = 'dashboard-umkm.html';
      else if (role === 'creator') window.location.href = 'dashboard-creator.html';
      else if (role === 'admin') window.location.href = 'dashboard-admin.html';
      else window.location.href = 'register.html?google=1';
    }

    const existingSession = KolabDB.getSession();
    if (existingSession) {
      redirectByRole(existingSession.role);
    } else if (KolabDB.getCurrentGoogleUser()) {
      window.location.href = 'register.html?google=1';
    } else {
      loadingBox.style.display = 'none';
      btnGoogleLogin.style.display = 'inline-flex';
    }

    async function handleGoogleSignIn(requestedRole) {
      generalError.style.display = 'none';
      btnGoogleLogin.disabled = true;
      btnGoogleLogin.querySelector('span').textContent = 'Menghubungkan ke Google...';

      try {
        const res = await KolabDB.signInWithGoogle(requestedRole ? { role: requestedRole } : undefined);
        if (requestedRole === 'admin' && res.role !== 'admin') {
          generalError.textContent = 'Akun Google ini tidak terdaftar sebagai administrator.';
          generalError.style.display = 'block';
          btnGoogleLogin.disabled = false;
          btnGoogleLogin.querySelector('span').textContent = 'Lanjutkan dengan Google';
          return;
        }
        if (res.needsOnboarding) {
          window.location.href = 'register.html?google=1';
          return;
        }
        if (res.user?.status === 'suspended') {
          generalError.textContent = 'Akun Anda sedang disuspend oleh administrator.';
          generalError.style.display = 'block';
          await KolabDB.signOut();
          btnGoogleLogin.disabled = false;
          btnGoogleLogin.querySelector('span').textContent = 'Lanjutkan dengan Google';
          return;
        }
        redirectByRole(res.role || res.user?.role);
      } catch (err) {
        generalError.textContent = err?.message || 'Gagal masuk dengan Google. Pastikan pop-up diizinkan.';
        generalError.style.display = 'block';
        btnGoogleLogin.disabled = false;
        btnGoogleLogin.querySelector('span').textContent = 'Lanjutkan dengan Google';
      }
    }

    btnGoogleLogin.addEventListener('click', () => handleGoogleSignIn());
    btnAdminLogin.addEventListener('click', () => handleGoogleSignIn('admin'));
    // Tombol masuk admin tidak ditampilkan ke publik. Admin membuka login.html?admin=1
    if (new URLSearchParams(window.location.search).has('admin')) {
      document.getElementById('adminLoginWrap').style.display = 'block';
    }
  </script>
</body>
</html>
