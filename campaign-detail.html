<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola kampanye – Kolab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    .person { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .person .av { flex: none; width: 48px; height: 48px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
    .person .av img { width: 100%; height: 100%; object-fit: cover; }
    .person .name { font-weight: 600; font-size: 16px; }
    .person .meta { font-size: 13px; color: var(--meta); display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .item { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 16px; background: var(--surface); }
    .item + .item { margin-top: 14px; }
    .item-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .video-frame { width: 100%; max-width: 340px; aspect-ratio: 9 / 16; border: 0; border-radius: var(--radius-sm); background: var(--night); }
    .video-wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .video-wrap > .side { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
    .stars { display: flex; gap: 4px; }
    .stars button { background: none; border: none; cursor: pointer; padding: 4px; font-size: 26px; line-height: 1; color: var(--line-strong); min-width: 36px; min-height: 36px; }
    .stars button.on { color: var(--accent); }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <main class="container" id="main" aria-live="polite"></main>

  <div class="modal-overlay" id="confirmModal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-content">
      <h2 class="card-title" id="confirmTitle" style="margin: 0 0 10px;"></h2>
      <p id="confirmBody" style="margin: 0 0 20px; color: var(--copy); font-size: 15px;"></p>
      <div style="display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap;">
        <button type="button" class="btn-outline btn-sm" id="confirmCancel">Batal</button>
        <button type="button" class="btn-primary btn-sm" id="confirmOk"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="licModal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="licTitle">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px;">
        <h2 class="card-title" id="licTitle" style="margin: 0;">Tambah hak pakai</h2>
        <button type="button" class="btn-outline btn-sm" id="licClose" aria-label="Tutup">Tutup</button>
      </div>
      <div id="licBody"></div>
    </div>
  </div>

  <script type="module" src="/src/kolab-cloud.ts"></script>
  <script type="module" src="/src/kolab-ui.ts"></script>
  <script type="module">
    const KolabDB = window.KolabDB;
    const KolabUI = window.KolabUI;
    await KolabDB.ready();
    const session = KolabDB.requireRole(['umkm']);

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const rp = (n) => KolabDB.formatRupiah(n || 0);
    const fmtDate = (d) => d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';
    const initials = (n) => String(n || '?').split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase();
    const main = document.getElementById('main');

    // Ubah tautan TikTok, Instagram, atau YouTube menjadi pemutar di dalam halaman
    function embedUrl(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.replace(/^www\./, '');
        if (host.includes('youtube.com') || host === 'youtu.be') {
          const id = host === 'youtu.be' ? u.pathname.slice(1) : (u.searchParams.get('v') || (u.pathname.match(/\/shorts\/([\w-]+)/) || [])[1]);
          return id ? `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}` : null;
        }
        if (host.includes('tiktok.com')) {
          const id = (u.pathname.match(/\/video\/(\d+)/) || [])[1];
          return id ? `https://www.tiktok.com/embed/v2/${id}` : null;
        }
        if (host.includes('instagram.com')) {
          const m = u.pathname.match(/\/(p|reel|reels)\/([\w-]+)/);
          return m ? `https://www.instagram.com/${m[1] === 'reels' ? 'reel' : m[1]}/${m[2]}/embed` : null;
        }
      } catch { /* bukan URL */ }
      return null;
    }

    function confirmDialog({ title, body, ok }) {
      return new Promise((resolve) => {
        const m = document.getElementById('confirmModal');
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmBody').textContent = body;
        const okBtn = document.getElementById('confirmOk'); okBtn.textContent = ok;
        const close = (v) => { m.style.display = 'none'; okBtn.onclick = null; document.getElementById('confirmCancel').onclick = null; resolve(v); };
        okBtn.onclick = () => close(true);
        document.getElementById('confirmCancel').onclick = () => close(false);
        m.style.display = 'flex';
        okBtn.focus();
      });
    }

    function personHtml(cr) {
      const soc = KolabDB.getSocialSummary(cr.id) || {};
      const rev = KolabDB.getReviewsForUser(cr.id) || {};
      const followers = Number(soc.totalFollowers || 0);
      return `
        <div class="person">
          <span class="av">${cr.avatarUrl ? `<img src="${esc(cr.avatarUrl)}" alt="" referrerpolicy="no-referrer">` : esc(initials(cr.name))}</span>
          <div style="min-width: 0;">
            <a class="name" href="creator-profile.html?id=${encodeURIComponent(cr.id)}" style="text-decoration: underline; text-underline-offset: 3px;">${esc(cr.name)}</a>
            <div class="meta">
              <span>${esc(cr.niche ? cr.niche.charAt(0).toUpperCase() + cr.niche.slice(1) : 'Umum')}</span>
              <span>${followers ? followers.toLocaleString('id-ID') + ' pengikut' : 'Belum menyambungkan akun'}</span>
              <span>${rev.average != null ? 'Rating ' + rev.average + ' (' + rev.count + ')' : 'Kreator baru'}</span>
            </div>
          </div>
        </div>`;
    }

    if (session) {
      KolabUI.renderNavbar('dashboard-umkm');
      const campaignId = new URLSearchParams(window.location.search).get('id');
      let tab = 'pelamar';
      let revisionOpen = null;

      await KolabDB.runAutoActions(session.id);

      function notFound(msg) {
        main.innerHTML = `<div class="empty-state" style="max-width: 520px; margin: 60px auto;"><strong>${esc(msg)}</strong><div style="margin-top: 16px;"><a href="dashboard-umkm.html" class="btn-primary btn-sm">Kembali ke dashboard</a></div></div>`;
      }

      function render() {
        const c = campaignId ? KolabDB.getCampaignById(campaignId) : null;
        if (!c) return notFound('Kampanye tidak ditemukan');
        if (c.umkmId !== session.id) return notFound('Kamu tidak punya akses ke kampanye ini');

        const apps = KolabDB.getApplicationsByCampaign(c.id);
        const pending = apps.filter((a) => a.status === 'pending');
        const invited = apps.filter((a) => a.status === 'invited');
        const accepted = apps.filter((a) => a.status === 'accepted' || a.status === 'completed');
        const subs = accepted.map((a) => KolabDB.getSubmissionByApplication(a.id)).filter(Boolean);
        const waiting = subs.filter((s) => s.status === 'submitted').length;
        const approved = subs.filter((s) => s.status === 'approved').length;
        const rights = KolabDB.usageRightsOf(c);
        const isOpen = c.status === 'open';
        const statusLabel = c.status === 'completed' ? 'Selesai' : c.status === 'cancelled' ? 'Dibatalkan' : (c.slotsLeft === 0 ? 'Penuh' : 'Terbuka');
        const platforms = Array.isArray(c.platform) ? c.platform.join(', ') : c.platform;

        main.innerHTML = `
          <a href="dashboard-umkm.html" style="font-size: 14px; color: var(--meta); display: inline-flex; gap: 6px; margin-bottom: 14px;">← Kembali ke dashboard</a>
          <div class="page-head">
            <div style="min-width: 0;">
              <span class="eyebrow">Kampanye · ${statusLabel}</span>
              <h1 style="margin: 8px 0 0;">${esc(c.title)}</h1>
              <p>${esc(platforms)} · ${esc(c.contentType || 'Video review')} · Batas kirim ${fmtDate(c.deadline)}</p>
            </div>
            ${isOpen ? `<button type="button" class="btn-outline btn-sm" id="btnCancelCamp">Batalkan kampanye</button>` : ''}
          </div>

          <div class="grid-4" style="margin-bottom: 24px;">
            <div class="stat-card"><div class="stat-label">Kreator diterima</div><div class="stat-value tabular-nums">${accepted.length}<span style="font-size: 20px; color: var(--meta);"> / ${c.slots}</span></div></div>
            <div class="stat-card"><div class="stat-label">Pelamar menunggu</div><div class="stat-value tabular-nums">${pending.length}</div></div>
            <div class="stat-card"><div class="stat-label">Video menunggu review</div><div class="stat-value tabular-nums">${waiting}</div></div>
            <div class="stat-card"><div class="stat-label">Honor per kreator</div><div class="stat-value tabular-nums" style="font-size: 28px;">${rp(c.budgetPerSlot)}</div></div>
          </div>

          <div class="tabs-nav" role="tablist" aria-label="Bagian kampanye">
            ${[['pelamar', `Pelamar (${pending.length})`], ['video', `Video (${subs.length})`], ['rekomendasi', 'Undang kreator'], ['arahan', 'Arahan & hak pakai']]
              .map(([k, l]) => `<button type="button" role="tab" class="tab-btn ${tab === k ? 'active' : ''}" aria-selected="${tab === k}" data-tab="${k}">${l}</button>`).join('')}
          </div>
          <div id="tabBody" role="tabpanel"></div>
          <div id="reviewBox" style="margin-top: 28px;"></div>
        `;

        main.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
        document.getElementById('btnCancelCamp')?.addEventListener('click', async () => {
          const ok = await confirmDialog({ title: 'Batalkan kampanye?', body: 'Pelamar tidak bisa bergabung lagi. Dana untuk slot yang belum disetujui kembali ke saldomu. Video yang sudah disetujui tetap dibayar.', ok: 'Ya, batalkan' });
          if (!ok) return;
          const r = KolabDB.cancelCampaign(c.id, session.id);
          await KolabDB.flush();
          KolabUI.showToast(r.ok ? 'Kampanye dibatalkan. Dana dikembalikan ke saldo.' : (r.message || 'Gagal membatalkan.'));
          render();
        });

        const body = document.getElementById('tabBody');

        // ---------- PELAMAR ----------
        if (tab === 'pelamar') {
          const pendingHtml = pending.map((a) => {
            const cr = KolabDB.getUserById(a.creatorId) || { id: a.creatorId, name: 'Kreator' };
            return `
              <div class="item">
                <div class="item-top">
                  ${personHtml(cr)}
                  <div class="actions">
                    <button type="button" class="btn-outline btn-sm" data-reject="${a.id}">Tolak</button>
                    <button type="button" class="btn-primary btn-sm" data-accept="${a.id}" ${c.slotsLeft === 0 ? 'disabled' : ''}>Terima</button>
                  </div>
                </div>
              </div>`;
          }).join('');
          const listOf = (arr, label, cls) => arr.map((a) => {
            const cr = KolabDB.getUserById(a.creatorId) || { id: a.creatorId, name: 'Kreator' };
            return `<div class="item"><div class="item-top">${personHtml(cr)}<span class="badge ${cls}">${label}</span></div></div>`;
          }).join('');
          body.innerHTML = `
            ${c.slotsLeft === 0 && pending.length ? `<div class="notice-bar" style="margin-bottom: 14px;">Semua slot sudah terisi. Tolak pelamar lain, atau buat kampanye baru untuk kreator tambahan.</div>` : ''}
            ${pending.length ? pendingHtml : `<div class="empty-state"><strong>Belum ada pelamar baru</strong>${isOpen ? 'Kreator yang melamar akan muncul di sini. Kamu juga bisa mengundang kreator lewat tab Undang kreator.' : 'Kampanye ini sudah tidak menerima pelamar.'}</div>`}
            ${accepted.length ? `<h3 class="serif" style="font-size: 24px; margin: 28px 0 12px;">Sudah diterima</h3>${listOf(accepted, 'Diterima', 'badge-open')}` : ''}
            ${invited.length ? `<h3 class="serif" style="font-size: 24px; margin: 28px 0 12px;">Menunggu jawaban undangan</h3>${listOf(invited, 'Diundang', 'badge-notice')}` : ''}
          `;
          body.querySelectorAll('[data-accept]').forEach((b) => b.addEventListener('click', async () => {
            const r = KolabDB.decideApplication(b.dataset.accept, true);
            await KolabDB.flush();
            KolabUI.showToast(r.ok ? 'Kreator diterima. Mereka bisa mulai membuat video.' : r.message);
            render();
          }));
          body.querySelectorAll('[data-reject]').forEach((b) => b.addEventListener('click', async () => {
            const ok = await confirmDialog({ title: 'Tolak pelamar ini?', body: 'Kreator akan melihat lamarannya tidak diterima.', ok: 'Tolak' });
            if (!ok) return;
            const r = KolabDB.decideApplication(b.dataset.reject, false);
            await KolabDB.flush();
            KolabUI.showToast(r.ok ? 'Lamaran ditolak.' : r.message);
            render();
          }));
        }

        // ---------- VIDEO ----------
        if (tab === 'video') {
          if (!accepted.length) {
            body.innerHTML = `<div class="empty-state"><strong>Belum ada kreator yang diterima</strong>Terima pelamar dulu, lalu video mereka akan masuk ke sini.</div>`;
          } else {
            body.innerHTML = accepted.map((a) => {
              const cr = KolabDB.getUserById(a.creatorId) || { id: a.creatorId, name: 'Kreator' };
              const sub = KolabDB.getSubmissionByApplication(a.id);
              if (!sub) {
                return `<div class="item"><div class="item-top">${personHtml(cr)}<span class="badge badge-neutral">Sedang membuat video</span></div><div style="font-size: 14px; color: var(--meta);">Batas kirim ${fmtDate(c.deadline)}. Kalau tidak dikirim sampai tanggal itu, honornya kembali ke saldomu.</div></div>`;
              }
              const count = Number(sub.revisionCount || 0);
              const left = KolabDB.MAX_REVISIONS - count;
              const hrs = KolabDB.autoApproveHoursLeft(sub);
              const embed = embedUrl(sub.fileUrl);
              const badge = sub.status === 'approved' ? '<span class="badge badge-open">Disetujui, honor dibayar</span>'
                : sub.status === 'revision' ? '<span class="badge badge-notice">Sedang direvisi kreator</span>'
                : '<span class="badge badge-accent">Perlu kamu review</span>';
              const thread = `
                <div class="chat-thread" aria-label="Catatan">
                  ${sub.note ? `<div class="chat-bubble in">${esc(sub.note)}<span class="time">${esc(cr.name)}</span></div>` : ''}
                  ${sub.revisionNote ? `<div class="chat-bubble out">${esc(sub.revisionNote)}<span class="time">Catatan revisi ke-${count}</span></div>` : ''}
                  ${!sub.note && !sub.revisionNote ? `<div style="font-size: 13px; color: var(--meta);">Belum ada catatan.</div>` : ''}
                </div>`;
              const reviewActions = sub.status === 'submitted' ? `
                <div style="font-size: 14px; color: var(--copy);">Kalau tidak kamu respons, video otomatis disetujui dalam <strong>${Math.ceil(hrs ?? 0)} jam</strong>.</div>
                ${revisionOpen === sub.id ? `
                  <form data-revform="${sub.id}" novalidate>
                    <label class="form-label" for="rev_${sub.id}">Apa yang perlu diperbaiki?</label>
                    <textarea id="rev_${sub.id}" class="input" rows="3" maxlength="1000" placeholder="Contoh: Tolong sebut promo Jumat di 3 detik pertama, dan tampilkan menu dari dekat."></textarea>
                    <div class="form-hint">Catatan mengacu ke arahan video awal. Sisa revisi: ${left} dari ${KolabDB.MAX_REVISIONS}.</div>
                    <div class="actions" style="margin-top: 10px;">
                      <button type="button" class="btn-outline btn-sm" data-revcancel>Batal</button>
                      <button type="submit" class="btn-dark btn-sm">Kirim catatan revisi</button>
                    </div>
                  </form>` : `
                  <div class="actions">
                    <button type="button" class="btn-outline btn-sm" data-revise="${sub.id}" ${left <= 0 ? 'disabled' : ''}>${left <= 0 ? 'Revisi habis' : 'Minta revisi'}</button>
                    <button type="button" class="btn-primary btn-sm" data-approve="${sub.id}">Setujui dan bayar</button>
                  </div>`}` : '';
              const approvedExtra = sub.status === 'approved' ? `
                <div class="kv"><span class="k">Hak pakai</span><span class="v">${esc(rights.label)}</span></div>
                ${rights.key !== 'buyout' ? `<button type="button" class="btn-outline btn-sm" data-lic="${sub.id}" style="align-self: flex-start;">Tambah hak pakai</button>` : ''}` : '';
              return `
                <div class="item">
                  <div class="item-top">${personHtml(cr)}${badge}</div>
                  <div class="video-wrap">
                    ${embed ? `<iframe class="video-frame" src="${esc(embed)}" title="Video dari ${esc(cr.name)}" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>` : ''}
                    <div class="side">
                      <a href="${esc(sub.fileUrl)}" target="_blank" rel="noopener" class="text-accent" style="font-weight: 600; word-break: break-all;">Buka video di tab baru ↗</a>
                      <div>
                        <div style="display: flex; justify-content: space-between; font-size: 13px; color: var(--meta); margin-bottom: 6px;"><span>Revisi terpakai</span><span>${count} dari ${KolabDB.MAX_REVISIONS}</span></div>
                        <div class="progress" aria-hidden="true">${Array.from({ length: KolabDB.MAX_REVISIONS }, (_, i) => `<span class="${i < count ? 'on' : ''}"></span>`).join('')}</div>
                      </div>
                      ${thread}
                      ${reviewActions}
                      ${approvedExtra}
                    </div>
                  </div>
                </div>`;
            }).join('');

            body.querySelectorAll('[data-revise]').forEach((b) => b.addEventListener('click', () => { revisionOpen = b.dataset.revise; render(); document.getElementById('rev_' + revisionOpen)?.focus(); }));
            body.querySelectorAll('[data-revcancel]').forEach((b) => b.addEventListener('click', () => { revisionOpen = null; render(); }));
            body.querySelectorAll('[data-revform]').forEach((f) => f.addEventListener('submit', async (e) => {
              e.preventDefault();
              const id = f.dataset.revform;
              const r = KolabDB.requestRevision(id, document.getElementById('rev_' + id).value);
              if (!r.ok) { KolabUI.showToast(r.message); return; }
              await KolabDB.flush();
              revisionOpen = null;
              KolabUI.showToast(`Catatan revisi terkirim. Sisa revisi ${r.remaining}.`);
              render();
            }));
            body.querySelectorAll('[data-approve]').forEach((b) => b.addEventListener('click', async () => {
              const ok = await confirmDialog({ title: 'Setujui video ini?', body: `Honor ${rp(c.budgetPerSlot)} akan dibayarkan ke kreator dan tidak bisa ditarik kembali.`, ok: 'Setujui dan bayar' });
              if (!ok) return;
              const r = KolabDB.approveSubmission(b.dataset.approve);
              await KolabDB.flush();
              KolabUI.showToast(r.ok ? 'Video disetujui. Honor sudah dibayarkan ke kreator.' : (r.message || 'Gagal menyetujui.'));
              render();
            }));
            body.querySelectorAll('[data-lic]').forEach((b) => b.addEventListener('click', () => openLic(b.dataset.lic)));
          }
        }

        // ---------- UNDANG KREATOR ----------
        if (tab === 'rekomendasi') {
          const recs = KolabDB.recommendCreatorsForCampaign(c.id) || [];
          const info = KolabDB.getRecommendationInfo(c.id) || { locked: 0 };
          body.innerHTML = `
            <p style="margin: 0 0 16px; color: var(--copy);">Kreator berikut cocok dengan bidang dan jenis video kampanyemu. Undangan harus diterima kreator dulu sebelum mereka bergabung.</p>
            ${recs.length ? recs.map((rec) => {
              const cr = rec.creator;
              const existing = apps.find((a) => a.creatorId === cr.id);
              const state = existing ? ({ pending: 'Sudah melamar', invited: 'Sudah diundang', accepted: 'Sudah diterima', completed: 'Sudah diterima', rejected: 'Ditolak', declined: 'Menolak undangan', expired: 'Batal' }[existing.status] || 'Terdaftar') : '';
              return `
                <div class="item">
                  <div class="item-top">
                    ${personHtml(cr)}
                    <div class="actions">
                      <span class="badge badge-soft">Cocok ${Math.round((rec.score || 0) * 100)}%</span>
                      ${existing ? `<span class="badge badge-neutral">${state}</span>` : `<button type="button" class="btn-primary btn-sm" data-invite="${cr.id}" ${!isOpen || c.slotsLeft === 0 ? 'disabled' : ''}>Undang</button>`}
                    </div>
                  </div>
                </div>`;
            }).join('') : `<div class="empty-state"><strong>Belum ada rekomendasi</strong>Kreator yang cocok akan muncul di sini.</div>`}
            ${info.locked > 0 ? `<div class="notice-bar" style="margin-top: 14px;">${info.locked} kreator cocok lainnya bisa kamu lihat dengan paket Pro atau Business. <a href="pricing.html" style="font-weight: 700; text-decoration: underline; margin-left: 6px;">Lihat paket</a></div>` : ''}
          `;
          body.querySelectorAll('[data-invite]').forEach((b) => b.addEventListener('click', async () => {
            const r = KolabDB.inviteCreator(c.id, b.dataset.invite);
            await KolabDB.flush();
            KolabUI.showToast(r.ok ? 'Undangan terkirim. Tunggu kreator menerima.' : r.message);
            render();
          }));
        }

        // ---------- ARAHAN ----------
        if (tab === 'arahan') {
          body.innerHTML = `
            <div class="grid-main-side">
              <div class="card">
                <h2 class="card-title" style="margin: 0 0 12px;">Arahan video</h2>
                <p style="white-space: pre-line; margin: 0; font-size: 15px; color: var(--copy);">${esc(c.brief)}</p>
              </div>
              <div class="card">
                <div class="kv"><span class="k">Platform</span><span class="v">${esc(platforms)}</span></div>
                <div class="kv"><span class="k">Jenis video</span><span class="v">${esc(c.contentType || 'Video review')}</span></div>
                <div class="kv"><span class="k">Batas kirim</span><span class="v">${fmtDate(c.deadline)}</span></div>
                <div class="kv"><span class="k">Hak pakai</span><span class="v">${esc(rights.label)}</span></div>
                <p style="margin: 12px 0 0; font-size: 13px; color: var(--meta);">${esc(rights.detail)}</p>
              </div>
            </div>`;
        }

        // ---------- ULASAN ----------
        const reviewable = accepted.map((a) => KolabDB.getUserById(a.creatorId)).filter((cr) => cr && KolabDB.canReview(c.id, session.id, cr.id));
        document.getElementById('reviewBox').innerHTML = reviewable.length ? `
          <section class="card" aria-labelledby="revTitle">
            <h2 class="card-title" id="revTitle" style="margin: 0 0 6px;">Beri ulasan untuk kreator</h2>
            <p style="margin: 0 0 16px; color: var(--copy); font-size: 14px;">Ulasanmu membantu UMKM lain memilih kreator.</p>
            ${reviewable.map((cr) => `
              <form class="item" data-review="${cr.id}" novalidate>
                ${personHtml(cr)}
                <fieldset style="border: none; padding: 0; margin: 0;">
                  <legend class="form-label">Rating</legend>
                  <div class="stars" data-stars="${cr.id}">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-v="${n}" aria-label="${n} bintang">★</button>`).join('')}</div>
                </fieldset>
                <textarea class="input" rows="2" maxlength="500" placeholder="Bagaimana kerja sama dengan kreator ini?" aria-label="Ulasan untuk ${esc(cr.name)}"></textarea>
                <button type="submit" class="btn-dark btn-sm" style="align-self: flex-start;">Kirim ulasan</button>
              </form>`).join('')}
          </section>` : '';
        document.querySelectorAll('[data-stars]').forEach((wrap) => {
          wrap.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => {
            wrap.dataset.value = btn.dataset.v;
            wrap.querySelectorAll('button').forEach((x) => { x.classList.toggle('on', Number(x.dataset.v) <= Number(btn.dataset.v)); x.setAttribute('aria-pressed', String(Number(x.dataset.v) <= Number(btn.dataset.v))); });
          }));
        });
        document.querySelectorAll('[data-review]').forEach((f) => f.addEventListener('submit', async (e) => {
          e.preventDefault();
          const rating = Number(f.querySelector('[data-stars]').dataset.value || 0);
          if (!rating) { KolabUI.showToast('Pilih rating dulu, 1 sampai 5 bintang.'); return; }
          const r = KolabDB.addReview(c.id, session.id, f.dataset.review, rating, f.querySelector('textarea').value.trim());
          await KolabDB.flush();
          KolabUI.showToast(r.ok ? 'Terima kasih, ulasan terkirim.' : (r.message || 'Gagal mengirim ulasan.'));
          render();
        }));
      }

      // Tambah hak pakai (beli lisensi iklan atau hak milik penuh)
      let licSub = null;
      function openLic(subId) {
        licSub = subId;
        const opts = KolabDB.getLicenseOptions(session.id, subId);
        if (!opts.ok) { KolabUI.showToast(opts.message || 'Tidak tersedia.'); return; }
        const wallet = KolabDB.getWallet(session.id);
        document.getElementById('licBody').innerHTML = `
          <div class="kv" style="margin-bottom: 8px;"><span class="k">Saldo kamu</span><span class="v tabular-nums">${rp(wallet.balance)}</span></div>
          ${opts.options.map((o) => `
            <div class="item" style="margin-top: 10px;">
              <div class="item-top"><strong>${o.type === 'ads' ? 'Izin iklan 6 bulan' : 'Hak milik penuh'}</strong><span class="tabular-nums" style="font-weight: 700;">${rp(o.price)}</span></div>
              <div style="font-size: 14px; color: var(--copy);">${o.type === 'ads' ? 'Boleh dipakai untuk iklan berbayar TikTok dan Meta selama 6 bulan.' : 'Video jadi milikmu sepenuhnya dan ditarik dari penjualan.'}${opts.discount > 0 ? ` Sudah termasuk diskon paket ${Math.round(opts.discount * 100)}%.` : ''}</div>
              ${o.owned ? '<span class="badge badge-open" style="align-self: flex-start;">Sudah kamu miliki</span>' : !o.available ? `<span class="badge badge-neutral" style="align-self: flex-start;">${esc(o.reason || 'Tidak tersedia')}</span>` : `<button type="button" class="btn-primary btn-sm" data-buy="${o.type}" data-price="${o.price}" style="align-self: flex-start;">Beli ${rp(o.price)}</button>`}
            </div>`).join('')}`;
        document.getElementById('licModal').style.display = 'flex';
        document.querySelectorAll('[data-buy]').forEach((b) => b.addEventListener('click', () => buyLic(b.dataset.buy, Number(b.dataset.price))));
      }
      const closeLic = () => { document.getElementById('licModal').style.display = 'none'; licSub = null; };
      document.getElementById('licClose').addEventListener('click', closeLic);
      async function buyLic(type, price) {
        const target = licSub;
        const wallet = KolabDB.getWallet(session.id);
        const finish = async () => {
          const r = KolabDB.purchaseLicense(session.id, target, type);
          await KolabDB.flush();
          KolabUI.showToast(r.ok ? 'Hak pakai bertambah.' : (r.message || 'Gagal membeli.'));
          render();
        };
        closeLic();
        if (wallet.balance >= price) return finish();
        const payAmt = Math.max(10000, Math.round(price - wallet.balance));
        KolabDB.openPaymentGateway({
          userId: session.id, amount: payAmt, purpose: 'license',
          title: type === 'buyout' ? 'Beli hak milik penuh' : 'Beli izin iklan 6 bulan',
          subtitle: `Kekurangan saldo ${rp(payAmt)}, bayar lewat QRIS atau transfer bank.`,
          metadata: { submissionId: target, licenseType: type },
          onSettled: async (order) => { KolabDB.topUp(session.id, payAmt, String(order.method || 'QRIS').toUpperCase().replace('_', ' ')); await finish(); },
        });
      }

      render();
    }
  </script>
</body>
</html>
