<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Kampanye - Kolab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .list-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      background: #fff;
    }
    .star-rating-select {
      display: flex;
      gap: 6px;
      font-size: 24px;
      cursor: pointer;
    }
    .star-rating-select span {
      color: #d1d5db;
      transition: color 0.15s ease;
    }
    .star-rating-select span.selected, .star-rating-select span:hover {
      color: #f59e0b;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <main class="container" id="mainContent">
    <!-- Diisi lewat JavaScript -->
  </main>

  <!-- Modal Beli Lisensi Tambahan -->
  <div class="modal-overlay" id="licModal" style="display: none;">
    <div class="modal-content" style="max-width: 480px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 18px; font-weight: 700;">Lisensi Tambahan Konten</h3>
        <button type="button" class="btn-outline btn-sm" onclick="closeLicModal()">✕</button>
      </div>
      <div id="licModalBody"></div>
    </div>
  </div>

  <!-- Modal Konfirmasi Approval -->
  <div class="modal-overlay" id="approveConfirmModal" style="display: none;">
    <div class="modal-content" style="max-width: 420px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 18px; font-weight: 700;">Setujui Konten Kreator?</h3>
        <button type="button" class="btn-outline btn-sm" onclick="closeApproveModal()">✕</button>
      </div>
      <p style="font-size: 14px; color: var(--copy); line-height: 1.5; margin: 0 0 20px;">
        Dana escrow untuk slot ini akan otomatis dicairkan ke saldo wallet kreator. Tindakan ini tidak dapat dibatalkan.
      </p>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="btn-outline btn-sm" onclick="closeApproveModal()">Batal</button>
        <button type="button" class="btn-primary btn-sm" id="btnConfirmApprove">Ya, Setujui &amp; Cairkan</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/kolab-cloud.ts"></script>
  <script type="module" src="/src/kolab-ui.ts"></script>
  <script type="module">
    const KolabDB = window.KolabDB;
    const KolabUI = window.KolabUI;
    await KolabDB.ready();

    const session = KolabDB.requireRole(['umkm']);

    if (session) {
      KolabUI.renderNavbar('dashboard-umkm');

      const mainContent = document.getElementById('mainContent');
      const urlParams = new URLSearchParams(window.location.search);
      const campaignId = urlParams.get('id');

      if (!campaignId) {
        renderNotFound('Parameter ID kampanye tidak ada.');
      } else {
        const campaign = KolabDB.getCampaignById(campaignId);

        if (!campaign) {
          renderNotFound('Data kampanye tidak ditemukan.');
        } else if (campaign.umkmId !== session.id) {
          renderUnauthorized();
        } else {
          renderCampaignDetail(campaign.id);
        }
      }

      function renderNotFound(message) {
        mainContent.innerHTML = `
          <div class="card" style="max-width: 500px; margin: 60px auto; text-align: center; padding: 40px 24px;">
            <div style="font-size: 40px; margin-bottom: 12px;">🔍</div>
            <h2 style="font-size: 20px; font-weight: 700; margin: 0 0 8px;">Kampanye Tidak Ditemukan</h2>
            <p style="color: var(--copy); font-size: 14px; margin: 0 0 24px;">${message || 'Data kampanye tidak ada atau telah dihapus.'}</p>
            <a href="dashboard-umkm.html" class="btn-primary" style="display: inline-flex;">Kembali ke Dashboard</a>
          </div>
        `;
      }

      function renderUnauthorized() {
        mainContent.innerHTML = `
          <div class="card" style="max-width: 500px; margin: 60px auto; text-align: center; padding: 40px 24px;">
            <div style="font-size: 40px; margin-bottom: 12px;">🚫</div>
            <h2 style="font-size: 20px; font-weight: 700; margin: 0 0 8px;">Akses Dibatasi</h2>
            <p style="color: var(--copy); font-size: 14px; margin: 0 0 24px;">Kamu tidak punya akses ke kampanye ini.</p>
            <a href="dashboard-umkm.html" class="btn-primary" style="display: inline-flex;">Kembali ke Dashboard</a>
          </div>
        `;
      }

      let activeTab = 'tab-applications';
      let editPerformanceSubId = null;

      function renderCampaignDetail(cId) {
        const c = KolabDB.getCampaignById(cId);
        if (!c) {
          renderNotFound('Kampanye sudah tidak tersedia.');
          return;
        }

        const platforms = Array.isArray(c.platform) ? c.platform.join(', ') : (c.platform || '-');
        let statusBadge = '<span class="badge badge-open">Terbuka</span>';
        if (c.status === 'completed') statusBadge = '<span class="badge badge-completed">Selesai</span>';
        else if (c.status === 'in_progress') statusBadge = '<span class="badge badge-neutral">Berjalan</span>';

        const roi = KolabDB.getCampaignROI(c.id) || {
          totalSpent: 0, totalViews: 0, totalEngagement: 0, totalClicks: 0, costPerEngagement: null
        };
        const cpeText = roi.costPerEngagement !== null ? KolabDB.formatRupiah(roi.costPerEngagement) : '-';

        mainContent.innerHTML = `
          <div style="margin-bottom: 20px;">
            <a href="dashboard-umkm.html" style="font-size: 13px; color: var(--copy); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;">
              ← Kembali ke Dashboard
            </a>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px;">
              <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
                  <h1 style="font-size: 26px; font-weight: 700; margin: 0;">${c.title || '(Tanpa judul)'}</h1>
                  ${statusBadge}
                  ${c.featured ? '<span class="badge" style="background: #fef8e7; color: #946800; font-size: 11px;">⭐ UNGGULAN</span>' : ''}
                </div>
                <div style="font-size: 14px; color: var(--copy); display: flex; gap: 16px; flex-wrap: wrap;">
                  <span>Platform: <strong>${platforms}</strong></span>
                  <span>·</span>
                  <span>Jenis: <strong>${c.contentType || 'UGC Review'}</strong></span>
                  <span>·</span>
                  <span class="tabular-nums">Slot: <strong>${c.slotsFilled || 0}/${c.slots} terisi</strong></span>
                  <span>·</span>
                  <span class="tabular-nums">Budget: <strong>${KolabDB.formatRupiah(c.budgetPerSlot)} / slot</strong></span>
                  ${c.targetNiche ? `<span>·</span><span>Target Niche: <strong>${c.targetNiche.toUpperCase()}</strong></span>` : ''}
                </div>
              </div>
            </div>
          </div>

          <!-- Ringkasan Brief -->
          <div class="card" style="margin-bottom: 24px; padding: 20px;">
            <h3 style="margin: 0 0 8px; font-size: 15px; font-weight: 600;">Brief Kreator:</h3>
            <p style="margin: 0; font-size: 14px; color: var(--copy); line-height: 1.6; white-space: pre-line;">${c.brief || '(Tidak ada petunjuk khusus)'}</p>
          </div>

          <!-- Section Ulasan Kampanye jika Selesai -->
          <div id="reviewSectionContainer"></div>

          <!-- ROI Kampanye Card -->
          <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
              <div>
                <h3 class="card-title">Performa & ROI Kampanye</h3>
                <div style="font-size: 12px; color: var(--copy); margin-top: 2px;">Akumulasi hasil penayangan dari seluruh konten kreator yang telah disetujui</div>
              </div>
              <span class="badge badge-neutral" style="font-size: 11px;">Data Live</span>
            </div>

            <div class="grid-4" style="gap: 14px;">
              <div style="background: var(--paper); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Total Biaya</div>
                <div class="stat-value tabular-nums" style="font-size: 20px; color: var(--accent);">${KolabDB.formatRupiah(roi.totalSpent)}</div>
                <div class="stat-sub">Slot terbayar</div>
              </div>
              <div style="background: var(--paper); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Total Views</div>
                <div class="stat-value tabular-nums" style="font-size: 20px;">${roi.totalViews.toLocaleString('id-ID')}</div>
                <div class="stat-sub">Tayangan video</div>
              </div>
              <div style="background: var(--paper); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Total Engagement</div>
                <div class="stat-value tabular-nums" style="font-size: 20px;">${roi.totalEngagement.toLocaleString('id-ID')}</div>
                <div class="stat-sub">Likes & komentar</div>
              </div>
              <div style="background: var(--paper); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Biaya / Engagement</div>
                <div class="stat-value tabular-nums" style="font-size: 20px; color: var(--text-success);">${cpeText}</div>
                <div class="stat-sub">Efisiensi biaya</div>
              </div>
            </div>
          </div>

          <!-- Tabs Navigasi -->
          <div class="tabs-nav">
            <button type="button" class="tab-btn ${activeTab === 'tab-applications' ? 'active' : ''}" onclick="switchTab('tab-applications', '${c.id}')">
              Kreator Bergabung (${KolabDB.getAcceptedCount(c.id)} / ${c.slots})
            </button>
            <button type="button" class="tab-btn ${activeTab === 'tab-submissions' ? 'active' : ''}" onclick="switchTab('tab-submissions', '${c.id}')">
              Konten Masuk & Lisensi
            </button>
            <button type="button" class="tab-btn ${activeTab === 'tab-recommendations' ? 'active' : ''}" onclick="switchTab('tab-recommendations', '${c.id}')">
              Rekomendasi Kreator Cocok
            </button>
          </div>

          <!-- Tab Content Container -->
          <div id="tabContentContainer">
            <!-- Diisi lewat JS -->
          </div>
        `;

        renderTabContent(c.id);
        renderReviewSection(c);
      }

      window.switchTab = function(tabName, cId) {
        activeTab = tabName;
        renderCampaignDetail(cId);
      };

      function renderTabContent(cId) {
        const container = document.getElementById('tabContentContainer');
        if (!container) return;

        if (activeTab === 'tab-applications') {
          renderApplicationsTab(cId, container);
        } else if (activeTab === 'tab-submissions') {
          renderSubmissionsTab(cId, container);
        } else if (activeTab === 'tab-recommendations') {
          renderRecommendationsTab(cId, container);
        }
      }

      /* ==============================================================
         TAB 1: Kreator Bergabung (Auto-accepted di Kolab v2)
         ============================================================== */
      function renderApplicationsTab(cId, container) {
        const apps = KolabDB.getApplicationsByCampaign(cId);

        if (!apps || apps.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              Belum ada kreator yang bergabung di kampanye ini. Undang kreator lewat tab Rekomendasi atau tunggu kreator mendaftar!
            </div>
          `;
          return;
        }

        let html = '';
        apps.forEach(function(app) {
          const creator = KolabDB.getUserById(app.creatorId) || {
            id: app.creatorId,
            name: 'Kreator #' + app.creatorId,
            niche: 'kreator'
          };

          const social = KolabDB.getSocialSummary(creator.id);
          const rev = KolabDB.getReviewsForUser(creator.id);
          const ratingText = rev.average !== null ? `⭐ ${rev.average} (${rev.count} ulasan)` : '⭐ Baru';
          const sub = KolabDB.getSubmissionByApplication(app.id);

          let subStatusLabel = '<span class="badge badge-neutral">Menunggu Unggahan Konten</span>';
          if (sub) {
            if (sub.status === 'submitted') subStatusLabel = '<span class="badge badge-submitted">Konten Diunggah (Perlu Review)</span>';
            else if (sub.status === 'revision' || sub.status === 'revision_requested') subStatusLabel = '<span class="badge badge-revision">Dalam Revisi</span>';
            else if (sub.status === 'approved') subStatusLabel = '<span class="badge badge-approved">Konten Disetujui ✓</span>';
          }

          html += `
            <div class="list-item-row">
              <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                  <a href="creator-profile.html?id=${encodeURIComponent(creator.id)}" style="font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: underline;" title="Lihat profil publik">
                    ${creator.name} ↗
                  </a>
                  <span class="badge badge-neutral" style="font-size: 11px;">Tier: ${social.tier}</span>
                  <span class="badge badge-completed">Telah Bergabung (Diterima)</span>
                </div>
                <div style="font-size: 13px; color: var(--copy); display: flex; gap: 12px; flex-wrap: wrap;">
                  <span>Niche: <strong>${creator.niche ? creator.niche.toUpperCase() : 'UMUM'}</strong></span>
                  <span>·</span>
                  <span class="tabular-nums">Followers: ${(social.totalFollowers || 0).toLocaleString('id-ID')}</span>
                  <span>·</span>
                  <span>${ratingText}</span>
                </div>
              </div>
              <div>
                ${subStatusLabel}
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      /* ==============================================================
         TAB 2: Konten Masuk & Lisensi Tambahan
         ============================================================== */
      function renderSubmissionsTab(cId, container) {
        const apps = KolabDB.getApplicationsByCampaign(cId);
        const acceptedApps = apps.filter(function(a) { return a.status === 'accepted'; });

        if (!acceptedApps || acceptedApps.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              Belum ada kreator yang bergabung untuk kampanye ini.
            </div>
          `;
          return;
        }

        let html = '';
        acceptedApps.forEach(function(app) {
          const creator = KolabDB.getUserById(app.creatorId) || { id: app.creatorId, name: 'Kreator' };
          const sub = KolabDB.getSubmissionByApplication(app.id);

          if (!sub) {
            html += `
              <div class="list-item-row" style="background: var(--paper);">
                <div>
                  <strong style="font-size: 15px;">${creator.name}</strong>
                  <div style="font-size: 13px; color: var(--copy); margin-top: 4px;">
                    Belum ada konten diunggah oleh kreator ini. Menunggu proses produksi.
                  </div>
                </div>
                <div>
                  <span class="badge badge-neutral">Menunggu Unggahan</span>
                </div>
              </div>
            `;
          } else {
            let statusBadge = '<span class="badge badge-submitted">Menunggu Review</span>';
            let actions = '';

            if (sub.status === 'submitted') {
              statusBadge = '<span class="badge badge-submitted">Perlu Review Anda</span>';
              actions = `
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  <button type="button" class="btn-outline btn-sm" onclick="handleRequestRevision('${sub.id}', '${cId}')">
                    Minta Revisi
                  </button>
                  <button type="button" class="btn-primary btn-sm" onclick="handleApproveSubmission('${sub.id}', '${cId}')">
                    Setujui & Cairkan Dana
                  </button>
                </div>
              `;
            } else if (sub.status === 'revision' || sub.status === 'revision_requested') {
              statusBadge = '<span class="badge badge-revision">Revisi Diminta</span>';
              actions = `<span style="font-size: 13px; color: var(--text-danger);">Menunggu kreator merevisi konten</span>`;
            } else if (sub.status === 'approved') {
              statusBadge = '<span class="badge badge-approved">Disetujui & Cair</span>';
              actions = `
                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                  <span style="font-size: 13px; color: var(--text-success); font-weight: 500;">✓ Escrow Dicairkan</span>
                  <button type="button" class="btn-outline btn-sm" onclick="openLicenseBuyModal('${sub.id}')">
                    🛒 Beli Lisensi Tambahan
                  </button>
                </div>
              `;
            }

            const fileUrlDisplay = sub.fileUrl
              ? `<a href="${sub.fileUrl}" target="_blank" rel="noopener" style="color: var(--accent); text-decoration: underline; word-break: break-all;">${sub.fileUrl} ↗</a>`
              : '<em>(Tautan belum dilampirkan)</em>';

            // Performance Section
            let performanceSection = '';
            if (sub.status === 'approved') {
              const hasPerf = sub.performance && (sub.performance.views > 0 || sub.performance.likes > 0);
              const isEditing = editPerformanceSubId === sub.id;

              if (hasPerf && !isEditing) {
                performanceSection = `
                  <div style="background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; margin-top: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                      <strong style="font-size: 13px; color: var(--ink);">📈 Hasil Performa Konten:</strong>
                      <button type="button" class="btn-outline btn-sm" style="font-size: 12px; padding: 3px 10px;" onclick="enableEditPerformance('${sub.id}', '${cId}')">Ubah Data</button>
                    </div>
                    <div style="display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap;">
                      <span>Views: <strong class="tabular-nums">${sub.performance.views.toLocaleString('id-ID')}</strong></span>
                      <span>·</span>
                      <span>Likes: <strong class="tabular-nums">${sub.performance.likes.toLocaleString('id-ID')}</strong></span>
                      <span>·</span>
                      <span>Komentar: <strong class="tabular-nums">${sub.performance.comments.toLocaleString('id-ID')}</strong></span>
                      <span>·</span>
                      <span>Klik Link: <strong class="tabular-nums">${sub.performance.clicks.toLocaleString('id-ID')}</strong></span>
                    </div>
                  </div>
                `;
              } else {
                const curV = sub.performance ? sub.performance.views : '';
                const curL = sub.performance ? sub.performance.likes : '';
                const curC = sub.performance ? sub.performance.comments : '';
                const curClk = sub.performance ? sub.performance.clicks : '';

                performanceSection = `
                  <div style="background: #fff; border: 1px dashed var(--line); border-radius: var(--radius-sm); padding: 14px; margin-top: 10px;">
                    <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Input Hasil Metrik Konten:</div>
                    <div class="grid-4" style="gap: 10px; margin-bottom: 10px;">
                      <div>
                        <label style="font-size: 11px; color: var(--copy); display: block;">Views</label>
                        <input type="number" id="perfViews_${sub.id}" class="input" style="padding: 6px 10px; font-size: 13px;" placeholder="0" min="0" value="${curV}">
                      </div>
                      <div>
                        <label style="font-size: 11px; color: var(--copy); display: block;">Likes</label>
                        <input type="number" id="perfLikes_${sub.id}" class="input" style="padding: 6px 10px; font-size: 13px;" placeholder="0" min="0" value="${curL}">
                      </div>
                      <div>
                        <label style="font-size: 11px; color: var(--copy); display: block;">Komentar</label>
                        <input type="number" id="perfComments_${sub.id}" class="input" style="padding: 6px 10px; font-size: 13px;" placeholder="0" min="0" value="${curC}">
                      </div>
                      <div>
                        <label style="font-size: 11px; color: var(--copy); display: block;">Klik</label>
                        <input type="number" id="perfClicks_${sub.id}" class="input" style="padding: 6px 10px; font-size: 13px;" placeholder="0" min="0" value="${curClk}">
                      </div>
                    </div>
                    <div style="display: flex; gap: 8px; justify-content: flex-end;">
                      ${isEditing ? `<button type="button" class="btn-outline btn-sm" onclick="cancelEditPerformance('${cId}')">Batal</button>` : ''}
                      <button type="button" class="btn-primary btn-sm" onclick="handleSavePerformance('${sub.id}', '${cId}')">Simpan Hasil</button>
                    </div>
                  </div>
                `;
              }
            }

            html += `
              <div class="list-item-row" style="flex-direction: column; align-items: stretch; gap: 14px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                  <div>
                    <a href="creator-profile.html?id=${encodeURIComponent(creator.id)}" style="font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: underline;">
                      ${creator.name} ↗
                    </a>
                    <span style="margin-left: 8px;">${statusBadge}</span>
                  </div>
                  <div style="font-size: 12px; color: var(--copy);">
                    Revisi: <strong class="tabular-nums">${sub.revisionCount || 0}</strong> kali
                  </div>
                </div>

                <div style="background: var(--paper); padding: 12px 14px; border-radius: 8px; font-size: 14px;">
                  <div style="font-size: 12px; color: var(--copy); margin-bottom: 2px;">Link Konten Unggahan:</div>
                  <div>${fileUrlDisplay}</div>
                </div>

                <div style="display: flex; justify-content: flex-end; align-items: center;">
                  ${actions}
                </div>

                ${performanceSection}
              </div>
            `;
          }
        });

        container.innerHTML = html;
      }

      /* ==============================================================
         TAB 3: Rekomendasi Kreator Cocok
         ============================================================== */
      function renderRecommendationsTab(cId, container) {
        const recommendations = KolabDB.recommendCreatorsForCampaign(cId);
        const info = KolabDB.getRecommendationInfo(cId);
        const existingApps = KolabDB.getApplicationsByCampaign(cId);

        if (!recommendations || recommendations.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              Belum ada kreator aktif yang tersedia untuk direkomendasikan.
            </div>
          `;
          return;
        }

        let lockedBanner = '';
        if (info && info.locked > 0) {
          lockedBanner = `
            <div class="card" style="background: #fef8e7; border-color: rgba(148, 104, 0, 0.2); padding: 16px 20px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
              <div>
                <strong style="color: var(--text-warning); font-size: 14px;">🔒 ${info.locked} Kreator Rekomendasi Lainnya Terkunci</strong>
                <div style="font-size: 12px; color: var(--ink); margin-top: 2px;">Paket Anda menampilkan hingga ${info.limit} rekomendasi teratas. Upgrade paket untuk membuka semua kandidat potensial.</div>
              </div>
              <a href="pricing.html" class="btn-primary btn-sm">Upgrade Paket</a>
            </div>
          `;
        }

        let html = `
          <div style="margin-bottom: 14px; font-size: 13px; color: var(--copy);">
            Kreator berikut dinilai secara otomatis berdasarkan target niche (${cId}), rating ulasan, dan engagement rate media sosial.
          </div>
          ${lockedBanner}
        `;

        recommendations.forEach(function(rec) {
          const cr = rec.creator;
          const scorePercent = Math.round(rec.score * 100) + '%';
          const ratingText = rec.reviews.average !== null ? `⭐ ${rec.reviews.average} (${rec.reviews.count} ulasan)` : '⭐ Baru';
          
          const alreadyAppliedOrInvited = existingApps.some(function(a) { return a.creatorId === cr.id; });

          let btnAction = '';
          if (alreadyAppliedOrInvited) {
            btnAction = `
              <button type="button" class="btn-outline btn-sm" disabled style="opacity: 0.6; cursor: not-allowed;">
                ✓ Sudah Bergabung
              </button>
            `;
          } else {
            btnAction = `
              <button type="button" class="btn-primary btn-sm" onclick="handleInviteCreator('${cId}', '${cr.id}')">
                + Undang Bergabung
              </button>
            `;
          }

          html += `
            <div class="list-item-row">
              <div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                  <a href="creator-profile.html?id=${encodeURIComponent(cr.id)}" style="font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: underline;" title="Lihat profil publik">
                    ${cr.name} ↗
                  </a>
                  <span class="badge" style="background: var(--accent); color: #fff; font-size: 11px;">Tier: ${rec.social.tier}</span>
                  <span class="badge badge-success" style="font-size: 11px;">Kecocokan: ${scorePercent}</span>
                </div>
                <div style="font-size: 13px; color: var(--copy); display: flex; gap: 12px; flex-wrap: wrap;">
                  <span>Niche: <strong>${cr.niche ? cr.niche.toUpperCase() : 'UMUM'}</strong></span>
                  <span>·</span>
                  <span class="tabular-nums">Followers: ${(rec.social.totalFollowers || 0).toLocaleString('id-ID')}</span>
                  <span>·</span>
                  <span>Engagement: <strong>${rec.social.avgEngagement}%</strong></span>
                  <span>·</span>
                  <span>Rating: ${ratingText}</span>
                </div>
              </div>
              <div>
                ${btnAction}
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      }

      /* ==============================================================
         SECTION: Beri Ulasan
         ============================================================== */
      function renderReviewSection(c) {
        const container = document.getElementById('reviewSectionContainer');
        if (!container) return;

        if (c.status !== 'completed') {
          container.innerHTML = '';
          return;
        }

        const apps = KolabDB.getApplicationsByCampaign(c.id).filter(function(a) { return a.status === 'accepted'; });
        if (apps.length === 0) {
          container.innerHTML = '';
          return;
        }

        let reviewCardsHtml = '';
        apps.forEach(function(app) {
          const creator = KolabDB.getUserById(app.creatorId) || { id: app.creatorId, name: 'Kreator' };
          const creatorReviews = KolabDB.getReviewsForUser(creator.id).reviews || [];
          const myReview = creatorReviews.find(function(r) { return r.reviewerId === session.id && r.campaignId === c.id; });

          if (myReview) {
            const stars = '★'.repeat(myReview.rating) + '☆'.repeat(5 - myReview.rating);
            reviewCardsHtml += `
              <div style="background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <strong style="font-size: 14px;">${creator.name}</strong>
                  <span style="color: #f59e0b; font-size: 16px;">${stars} (${myReview.rating}/5)</span>
                </div>
                <div style="font-size: 13px; color: var(--copy); font-style: italic;">"${myReview.comment || 'Ulasan tanpa komentar'}"</div>
                <div style="font-size: 11px; color: var(--text-success); margin-top: 6px;">✓ Ulasan Anda telah tersimpan</div>
              </div>
            `;
          } else {
            reviewCardsHtml += `
              <div style="background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px;">
                <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px;">Ulas Kerja Sama dengan ${creator.name}</div>
                
                <div class="form-group" style="margin-bottom: 10px;">
                  <label class="form-label" style="font-size: 12px;">Rating Bintang (1 - 5):</label>
                  <div class="star-rating-select" id="starContainer_${creator.id}">
                    <span onclick="setRating('${creator.id}', 1)">★</span>
                    <span onclick="setRating('${creator.id}', 2)">★</span>
                    <span onclick="setRating('${creator.id}', 3)">★</span>
                    <span onclick="setRating('${creator.id}', 4)">★</span>
                    <span onclick="setRating('${creator.id}', 5)">★</span>
                  </div>
                  <input type="hidden" id="ratingVal_${creator.id}" value="5">
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                  <textarea id="commentVal_${creator.id}" class="input" rows="2" placeholder="Bagaimana kualitas konten dan komunikasi kreator?"></textarea>
                </div>

                <div id="reviewError_${creator.id}" class="error-text" style="display: none; margin-bottom: 8px;"></div>

                <button type="button" class="btn-primary btn-sm" onclick="handleSubmitReview('${c.id}', '${creator.id}')">
                  Kirim Ulasan
                </button>
              </div>
            `;
          }
        });

        container.innerHTML = `
          <div class="card" style="margin-bottom: 24px; background: var(--bg-success); border-color: rgba(36,104,48,0.2);">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
              <span style="font-size: 20px;">⭐</span>
              <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: var(--text-success);">Ulasan Kerja Sama Kreator</h3>
            </div>
            <p style="margin: 0 0 14px; font-size: 13px; color: var(--ink);">
              Kampanye telah selesai! Berikan ulasan untuk kreator yang berpartisipasi guna membangun reputasi komunitas Kolab.
            </p>
            ${reviewCardsHtml}
          </div>
        `;

        apps.forEach(function(app) {
          setRating(app.creatorId, 5);
        });
      }

      window.setRating = function(creatorId, starCount) {
        const input = document.getElementById(`ratingVal_${creatorId}`);
        const container = document.getElementById(`starContainer_${creatorId}`);
        if (!input || !container) return;
        input.value = starCount;
        const stars = container.querySelectorAll('span');
        stars.forEach(function(s, idx) {
          if (idx < starCount) s.style.color = '#f59e0b';
          else s.style.color = '#d1d5db';
        });
      };

      window.handleSubmitReview = async function(cId, creatorId) {
        const rating = Number(document.getElementById(`ratingVal_${creatorId}`).value);
        const comment = (document.getElementById(`commentVal_${creatorId}`).value || '').trim();
        const err = document.getElementById(`reviewError_${creatorId}`);

        if (err) err.style.display = 'none';

        const res = KolabDB.addReview(cId, session.id, creatorId, rating, comment);
        if (res.ok) {
          await KolabDB.flush();
          KolabUI.showToast('Ulasan berhasil dikirim!');
          renderCampaignDetail(cId);
        } else {
          if (err) {
            err.textContent = res.message || 'Gagal mengirim ulasan';
            err.style.display = 'block';
          } else {
            KolabUI.showToast(res.message || 'Gagal mengirim ulasan');
          }
        }
      };

      /* ==============================================================
         ACTION HANDLERS
         ============================================================== */
      window.handleInviteCreator = async function(cId, creatorId) {
        const applyRes = KolabDB.applyToCampaign(cId, creatorId);
        if (applyRes.ok) {
          await KolabDB.flush();
          KolabUI.showToast('Kreator berhasil diundang dan langsung bergabung!');
          renderCampaignDetail(cId);
        } else {
          KolabUI.showToast(applyRes.message || 'Gagal mengundang kreator');
        }
      };

      window.handleRequestRevision = async function(subId, cId) {
        const res = KolabDB.requestRevision(subId);
        if (res.ok) {
          await KolabDB.flush();
          KolabUI.showToast('Permintaan revisi telah dikirim ke kreator');
          renderCampaignDetail(cId);
        } else {
          KolabUI.showToast(res.message || 'Gagal meminta revisi');
        }
      };

      let pendingApprove = null;

      window.handleApproveSubmission = function(subId, cId) {
        pendingApprove = { subId, cId };
        document.getElementById('approveConfirmModal').style.display = 'flex';
      };

      window.closeApproveModal = function() {
        document.getElementById('approveConfirmModal').style.display = 'none';
        pendingApprove = null;
      };

      document.getElementById('btnConfirmApprove').addEventListener('click', async function() {
        if (!pendingApprove) return;
        const { subId, cId } = pendingApprove;
        const btn = document.getElementById('btnConfirmApprove');
        btn.disabled = true;

        const res = KolabDB.approveSubmission(subId);
        if (res.ok) {
          await KolabDB.flush();
          closeApproveModal();
          KolabUI.showToast('Konten berhasil disetujui! Dana escrow telah dicairkan ke kreator.');
          renderCampaignDetail(cId);
        } else {
          closeApproveModal();
          KolabUI.showToast(res.message || 'Gagal menyetujui konten');
        }
        btn.disabled = false;
      });

      window.enableEditPerformance = function(subId, cId) {
        editPerformanceSubId = subId;
        renderCampaignDetail(cId);
      };

      window.cancelEditPerformance = function(cId) {
        editPerformanceSubId = null;
        renderCampaignDetail(cId);
      };

      window.handleSavePerformance = async function(subId, cId) {
        const v = document.getElementById(`perfViews_${subId}`).value;
        const l = document.getElementById(`perfLikes_${subId}`).value;
        const c = document.getElementById(`perfComments_${subId}`).value;
        const clk = document.getElementById(`perfClicks_${subId}`).value;

        const res = KolabDB.setContentPerformance(subId, { views: v, likes: l, comments: c, clicks: clk });
        if (res.ok) {
          await KolabDB.flush();
          editPerformanceSubId = null;
          KolabUI.showToast('Metrik performa konten berhasil diperbarui!');
          renderCampaignDetail(cId);
        } else {
          KolabUI.showToast(res.message || 'Gagal menyimpan hasil konten');
        }
      };

      // Modal Lisensi Tambahan
      let activeSubIdForLic = null;

      window.openLicenseBuyModal = function(subId) {
        activeSubIdForLic = subId;
        const opts = KolabDB.getLicenseOptions(session.id, subId);
        if (!opts.ok) {
          KolabUI.showToast(opts.message || 'Lisensi tidak tersedia');
          return;
        }

        const wallet = KolabDB.getWallet(session.id);
        const body = document.getElementById('licModalBody');

        let optionsHtml = '';
        opts.options.forEach(function(opt) {
          const discountBadge = opts.discount > 0 ? `<span class="badge badge-completed" style="font-size: 10px; margin-left: 6px;">Diskon ${Math.round(opts.discount * 100)}%</span>` : '';

          optionsHtml += `
            <div style="border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; background: ${opt.owned ? '#fafaf9' : '#fff'};">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div>
                  <strong style="font-size: 14px;">${opt.label}</strong>
                  ${discountBadge}
                </div>
                <div class="tabular-nums" style="font-size: 15px; font-weight: 700; color: var(--ink);">
                  ${opts.discount > 0 ? `<s style="font-size: 11px; color: var(--copy);">${KolabDB.formatRupiah(opt.basePrice)}</s> ` : ''}
                  ${KolabDB.formatRupiah(opt.price)}
                </div>
              </div>
              <div style="font-size: 12px; color: var(--copy); margin-bottom: 10px;">
                ${opt.type === 'ads' ? 'Bebas digunakan untuk iklan berbayar (Meta/TikTok Ads) selama 180 hari.' : 'Hak eksklusif seumur hidup atas video ini.'}
              </div>
              <div>
                ${opt.owned ? '<span class="badge badge-completed">✓ Sudah Dimiliki</span>' : !opt.available ? `<span class="badge badge-neutral">${opt.reason || 'Tidak Tersedia'}</span>` : `
                  <button type="button" class="btn-primary btn-sm" style="width: 100%; justify-content: center;" onclick="executeBuyLic('${opt.type}', ${opt.price})">
                    Beli Lisensi Ini (${KolabDB.formatRupiah(opt.price)})
                  </button>
                `}
              </div>
            </div>
          `;
        });

        body.innerHTML = `
          <div style="background: var(--paper); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 14px; display: flex; justify-content: space-between; font-size: 13px;">
            <span>Saldo Dompet:</span>
            <strong class="tabular-nums">${KolabDB.formatRupiah(wallet.balance)}</strong>
          </div>
          <div>${optionsHtml}</div>
        `;

        document.getElementById('licModal').style.display = 'flex';
      };

      window.closeLicModal = function() {
        document.getElementById('licModal').style.display = 'none';
        activeSubIdForLic = null;
      };

      window.executeBuyLic = async function(type, price) {
        const targetSubId = activeSubIdForLic;
        const wallet = KolabDB.getWallet(session.id);

        if (wallet.balance < price) {
          const payAmt = Math.max(10000, Math.round(price - wallet.balance));
          closeLicModal();
          KolabDB.openPaymentGateway({
            userId: session.id,
            amount: payAmt,
            purpose: 'license',
            title: `Bayar Lisensi ${type === 'buyout' ? 'Buyout Penuh' : 'Iklan 6 Bulan'}`,
            subtitle: `Pembayaran via QRIS atau Virtual Account untuk melengkapi saldo (${KolabDB.formatRupiah(payAmt)}).`,
            metadata: { submissionId: targetSubId, licenseType: type },
            onSettled: async function(order) {
              const methodLabel = String(order.method || 'QRIS').toUpperCase().replace('_', ' ');
              KolabDB.topUp(session.id, payAmt, methodLabel);
              const res = KolabDB.purchaseLicense(session.id, targetSubId, type);
              if (res.ok) {
                await KolabDB.flush();
                KolabUI.showToast('Pembayaran berhasil & lisensi konten aktif!');
                renderCampaignDetail(campaignId);
              } else {
                await KolabDB.flush();
                KolabUI.showToast(res.message || 'Gagal menyelesaikan pembelian lisensi');
              }
            },
          });
          return;
        }

        const res = KolabDB.purchaseLicense(session.id, targetSubId, type);
        if (res.ok) {
          await KolabDB.flush();
          closeLicModal();
          KolabUI.showToast('Lisensi berhasil dibeli!');
          renderCampaignDetail(campaignId);
        } else {
          KolabUI.showToast(res.message || 'Gagal membeli lisensi');
        }
      };
    }
  </script>
</body>
</html>
