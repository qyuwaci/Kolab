<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Kreator - Kolab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container" id="profileContainer" style="max-width: 840px;">
    <!-- Diisi via JS -->
  </main>

  <script src="kolab-db.js"></script>
  <script src="kolab-ui.js"></script>
  <script>
    const session = KolabDB.getSession();
    if (!session) {
      window.location.href = 'login.html';
    } else {
      KolabUI.renderNavbar('');

      const urlParams = new URLSearchParams(window.location.search);
      const creatorId = urlParams.get('id');
      const container = document.getElementById('profileContainer');

      const user = creatorId ? KolabDB.getUserById(creatorId) : null;

      if (!user || user.role !== 'creator') {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 48px 24px; margin-top: 40px;">
            <div style="font-size: 36px; margin-bottom: 12px;">👤</div>
            <h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 700;">Profil Kreator Tidak Ditemukan</h2>
            <p style="color: var(--copy); font-size: 14px; margin: 0 0 24px;">Akun kreator tidak tersedia atau ID tidak valid.</p>
            <button type="button" class="btn-primary" onclick="history.back()">Kembali</button>
          </div>
        `;
      } else {
        renderCreatorProfile(user);
      }

      function formatFollowersNumber(n) {
        n = Number(n) || 0;
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
        return n.toLocaleString('id-ID');
      }

      function renderCreatorProfile(creator) {
        const social = KolabDB.getSocialSummary(creator.id);
        const reviewsData = KolabDB.getReviewsForUser(creator.id);

        let reviewsHtml = '';
        if (!reviewsData.count || reviewsData.count === 0) {
          reviewsHtml = `
            <div class="empty-state">
              Belum ada ulasan untuk kreator ini.
            </div>
          `;
        } else {
          reviewsData.list.forEach(function(r) {
            const reviewer = KolabDB.getUserById(r.reviewerId);
            const reviewerName = reviewer ? reviewer.name : 'Pengguna';
            const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
            const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleDateString('id-ID', {
              day: 'numeric', month: 'short', year: 'numeric'
            }) : '';

            reviewsHtml += `
              <div style="padding: 16px 0; border-bottom: 1px solid var(--line);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <div>
                    <strong style="font-size: 14px; color: var(--ink);">${reviewerName}</strong>
                    ${reviewer && reviewer.category ? `<span style="font-size: 12px; color: var(--copy);"> · ${reviewer.category}</span>` : ''}
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="color: #f59e0b; font-size: 14px;">${stars}</span>
                    <span style="font-size: 12px; color: var(--copy);">${dateStr}</span>
                  </div>
                </div>
                <p style="margin: 0; font-size: 14px; color: var(--copy); line-height: 1.5;">
                  ${r.comment || 'Ulasan tanpa komentar tambahan.'}
                </p>
              </div>
            `;
          });
        }

        const ratingDisplay = reviewsData.average !== null
          ? `<span style="font-size: 20px; font-weight: 700; color: #f59e0b;">${reviewsData.average} ★</span> <span style="font-size: 13px; color: var(--copy);">(${reviewsData.count} ulasan)</span>`
          : '<span style="font-size: 14px; color: var(--copy);">Belum ada ulasan</span>';

        let platformsBadgeHtml = '';
        if (social.platforms && social.platforms.length > 0) {
          social.platforms.forEach(function(p) {
            const acc = social.accounts[p];
            const icon = p === 'instagram' ? '📸 Instagram' : '🎵 TikTok';
            platformsBadgeHtml += `
              <div style="background: var(--paper); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; display: inline-flex; align-items: center; gap: 6px;">
                <span>${icon}:</span>
                <strong>${acc.handle}</strong>
                <span class="tabular-nums" style="color: var(--copy);">(${formatFollowersNumber(acc.followers)})</span>
              </div>
            `;
          });
        }

        container.innerHTML = `
          <div style="margin-bottom: 16px;">
            <button type="button" class="btn-outline btn-sm" onclick="history.back()">← Kembali</button>
          </div>

          <!-- Profile Card -->
          <div class="card" style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
              <div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
                  <h1 style="margin: 0; font-size: 26px; font-weight: 700;">${creator.name}</h1>
                  <span class="badge" style="background: var(--accent); color: #fff; font-size: 12px; padding: 4px 10px;">
                    Tier: ${social.tier}
                  </span>
                </div>
                <div style="font-size: 14px; color: var(--copy);">
                  Niche Utama: <strong style="color: var(--ink); text-transform: capitalize;">${creator.niche || 'General'}</strong>
                </div>
              </div>

              <div>
                ${ratingDisplay}
              </div>
            </div>

            <!-- Stats 3 Kolom -->
            <div class="grid-3" style="margin-bottom: 20px;">
              <div style="background: var(--paper); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Total Followers</div>
                <div class="stat-value tabular-nums" style="font-size: 24px;">${formatFollowersNumber(social.totalFollowers || creator.followers || 0)}</div>
              </div>
              <div style="background: var(--paper); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Rata-rata Engagement</div>
                <div class="stat-value tabular-nums" style="font-size: 24px; color: var(--text-success);">${social.avgEngagement}%</div>
              </div>
              <div style="background: var(--paper); padding: 14px; border-radius: var(--radius-sm);">
                <div class="stat-label">Status Verifikasi</div>
                <div class="stat-value" style="font-size: 18px; color: var(--text-success); font-weight: 600;">✓ Aktif</div>
              </div>
            </div>

            ${platformsBadgeHtml ? `
              <div style="border-top: 1px solid var(--line); padding-top: 16px; display: flex; gap: 10px; flex-wrap: wrap;">
                ${platformsBadgeHtml}
              </div>
            ` : ''}
          </div>

          <!-- Reviews Section -->
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Ulasan dari Mitra UMKM</h2>
              <span class="badge badge-neutral" style="font-size: 11px;">Riwayat Kolaborasi</span>
            </div>

            <div>
              ${reviewsHtml}
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
